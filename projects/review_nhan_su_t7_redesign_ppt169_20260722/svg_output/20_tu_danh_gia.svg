<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/><image href="../images/image_8fa7a601c29ca778.png" x="50" y="28" width="140" height="40" preserveAspectRatio="xMidYMid meet"/><text x="260" y="68" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#008C4F">Tự đánh giá ưu, nhược điểm</text>
  <g id="assessment" data-pptx-bounds="56 125 1168 430" font-family="Arial, sans-serif">
    <g><rect x="56" y="125" width="555" height="430" rx="20" fill="#EAF6F0"/><circle cx="106" cy="176" r="25" fill="#008C4F"/><path d="M95 176 l8 8 l15 -18" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="150" y="184" font-size="26" font-weight="700" fill="#008C4F">ƯU ĐIỂM</text><text x="86" y="245" font-size="20" fill="#1F2329"><tspan x="86" dy="0">• Năng lực end-to-end: firmware → tool → test</tspan><tspan x="86" dy="42">• Chủ động học nhanh và xử lý vấn đề mới</tspan><tspan x="86" dy="42">• Có tư duy hệ thống, ưu tiên bằng chứng</tspan><tspan x="86" dy="42">• Viết tài liệu, đào tạo và phối hợp liên team</tspan></text><rect x="86" y="455" width="475" height="62" rx="12" fill="#FFFFFF"/><text x="106" y="493" font-size="17" font-weight="700" fill="#008C4F">Bằng chứng: 102 task Done / 4 nhóm dự án chính</text></g>
    <g><rect x="669" y="125" width="555" height="430" rx="20" fill="#FFF7E8"/><circle cx="719" cy="176" r="25" fill="#F5A623"/><text x="719" y="184" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">!</text><text x="763" y="184" font-size="26" font-weight="700" fill="#B56A00">CẦN CẢI THIỆN</text><text x="699" y="245" font-size="20" fill="#1F2329"><tspan x="699" dy="0">• Dễ phân tán khi nhiều luồng chạy song song</tspan><tspan x="699" dy="42">• Ước lượng và ưu tiên chưa luôn nhất quán</tspan><tspan x="699" dy="42">• Một số task Late/Not started chưa được đóng</tspan><tspan x="699" dy="42">• Cần cập nhật trạng thái sau hỗ trợ thực địa</tspan></text><rect x="699" y="455" width="475" height="62" rx="12" fill="#FFFFFF"/><text x="719" y="493" font-size="17" font-weight="700" fill="#B56A00">Hành động: weekly planning + acceptance rõ ràng</text></g>
  </g>
  <rect x="56" y="590" width="1168" height="50" rx="12" fill="#F4F7F5"/><text x="640" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#1F2329">Tư duy cần duy trì: chủ động, đo được, tài liệu hóa — nhưng tập trung hơn vào ưu tiên và hoàn tất.</text><text x="1220" y="708" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#66706A">20 / 23</text></svg>
